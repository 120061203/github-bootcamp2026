<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>待辦清單</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="card">
    <div class="header-row">
      <h1>待辦清單</h1>
      <button type="button" id="theme-toggle" class="theme-toggle"></button>
    </div>

    <form id="todo-form" class="todo-form">
      <input
        type="text"
        id="todo-input"
        class="todo-input"
        placeholder="輸入待辦事項..."
        autocomplete="off"
      >
      <button type="submit" class="add-btn">新增</button>
    </form>

    <div class="filter-bar" id="filter-bar">
      <button type="button" class="filter-btn" data-filter="all">全部</button>
      <button type="button" class="filter-btn" data-filter="active">未完成</button>
      <button type="button" class="filter-btn" data-filter="completed">已完成</button>
    </div>

    <ul id="todo-list" class="todo-list"></ul>

    <p id="empty-state" class="empty-state" hidden>還沒有任何待辦事項,新增一個吧!</p>

    <footer class="todo-footer">
      <div class="todo-footer-row">
        <span>未完成:<span id="remaining-count">0</span> 項</span>
        <button
          type="button"
          id="clear-completed"
          class="clear-completed-btn"
          aria-label="清除所有已完成的待辦事項"
          hidden
        >
          清除已完成
        </button>
      </div>
    </footer>
  </main>

  <script src="app.js"></script>
</body>
</html>
