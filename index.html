<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>待辦清單</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="card">
    <h1>待辦清單</h1>

    <form id="todo-form" class="todo-form">
      <input
        type="text"
        id="todo-input"
        class="todo-input"
        placeholder="輸入待辦事項..."
        autocomplete="off"
      >
      <button type="submit" class="add-btn">新增</button>
    </form>

    <ul id="todo-list" class="todo-list"></ul>

    <p id="empty-state" class="empty-state" hidden>還沒有任何待辦事項,新增一個吧!</p>

    <footer class="todo-footer">
      <span>未完成:<span id="remaining-count">0</span> 項</span>
    </footer>
  </main>

  <script src="app.js"></script>
</body>
</html>
